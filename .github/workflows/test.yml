# Test the mirror tools. The update script runs under dash and BusyBox sh
# (the printers use BusyBox).
name: Test

on:
  push:
    branches: [main]
    paths: ["tools/**", "usb-kit/**", "tests/**", ".github/workflows/test.yml"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y busybox
      - run: pip install pytest
      - run: python -m pytest tests -v
        env:
          FF_TEST_SHELLS: "dash busybox-sh"
